apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend
          image: mediasoup-frontend:latest
          imagePullPolicy: Never

          ports:
            - name: http
              containerPort: 3000
              protocol: TCP

          env:
            - name: NODE_ENV
              value: "production"

            - name: BACKEND_URL
              value: "http://backend:4000"

            - name: NEXTAUTH_URL
              value: "http://127.0.0.1:30080"

            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: mediasoup-secrets
                  key: NEXTAUTH_SECRET

            - name: AUTH_BRIDGE_SECRET
              valueFrom:
                secretKeyRef:
                  name: mediasoup-secrets
                  key: AUTH_BRIDGE_SECRET

            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: mediasoup-secrets
                  key: GOOGLE_CLIENT_ID

            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: mediasoup-secrets
                  key: GOOGLE_CLIENT_SECRET

          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5