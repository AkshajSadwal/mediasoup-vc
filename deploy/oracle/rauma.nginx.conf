# Host Nginx configuration for a single Oracle Cloud VM.
# Replace YOUR_DOMAIN with the DNS name that points to the VM's reserved public IP.
# This is the initial HTTP config used by Certbot. Certbot will add the TLS
# server block and HTTP->HTTPS redirect when you run certbot --nginx --redirect.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream rauma_frontend {
    server 127.0.0.1:3000;
    keepalive 16;
}

upstream rauma_backend {
    server 127.0.0.1:4000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    server_tokens off;
    client_max_body_size 8m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(self), microphone=(self)" always;
    # Browsers ignore HSTS when delivered over plain HTTP; after Certbot enables
    # TLS, this header is learned only from the HTTPS response.
    add_header Strict-Transport-Security "max-age=31536000" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        try_files $uri =404;
    }

    # Backend authentication/profile API. Keep backend port 4000 private.
    location = /api/auth/signup { include /etc/nginx/snippets/rauma-backend-proxy.conf; }
    location = /api/auth/login  { include /etc/nginx/snippets/rauma-backend-proxy.conf; }
    location = /api/auth/google { include /etc/nginx/snippets/rauma-backend-proxy.conf; }
    location = /api/auth/me     { include /etc/nginx/snippets/rauma-backend-proxy.conf; }
    location = /api/auth/profile {
        client_max_body_size 8m;
        include /etc/nginx/snippets/rauma-backend-proxy.conf;
    }

    # Legacy local profile-image endpoint. After OCI Object Storage migration,
    # the app should return object URLs instead of proxying local files.
    location /profile-pictures/ {
        include /etc/nginx/snippets/rauma-backend-proxy.conf;
    }

    # NextAuth routes including /api/auth/callback/google go to Next.js.
    location /api/auth/ {
        proxy_pass http://rauma_frontend;
        include /etc/nginx/snippets/rauma-common-proxy.conf;
    }

    location /api/ {
        proxy_pass http://rauma_backend;
        include /etc/nginx/snippets/rauma-common-proxy.conf;
    }

    location /socket.io/ {
        proxy_pass http://rauma_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://rauma_frontend;
        include /etc/nginx/snippets/rauma-common-proxy.conf;
    }
}
